# MkDocs hooks. One, and it is a build-time check rather than a feature: it warns
# when `docs/llms.txt` is out of date with the nav above, which `--strict` turns
# into a failure. CI runs no pytest, so the docs build is the only check that
# runs on a documentation change, and this is where that check has to live.
#
# It sits under `docs/`, so the `docs/**` filter in the pages workflow covers it without
# naming it. (`scripts/gen_llms_txt.py`, which it imports, is the one build input outside that
# tree, and that path is listed there by name.) `exclude_docs` above is what keeps the file
# itself off the published site.
hooks:
  - docs/hooks/llms_txt_staleness.py

# The build is the link checker: `mkdocs build --strict` runs in CI and promotes
# every warning below to a failure. Anything omitted from `nav` also fails, so no
# document can be reachable only by guessing its filename.
#
# What it cannot check is a link that leaves the repository. The pages here cite
# measurements and designs that went to relic-core, relic-engine and PocketLLM, and
# those are written as absolute URLs on purpose -- a relative path into another
# repository is unresolvable from a published page and would pass this build
# precisely by never being inspected. See the note in `docs/README.md`.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  # Chinese headings appear in a dozen of these documents, so slugify has to keep
  # non-ASCII instead of stripping it the way the Markdown default does.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

watch:
  - docs
  - mkdocs.yml
