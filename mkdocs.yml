# Documentation site for RelicLLM, published to GitHub Pages by
# .github/workflows/pages.yml.
#
# `docs_dir` points at the `docs/` tree the repository already had, so publishing the
# site moves no files: the same markdown is the GitHub directory index and the site
# source. `docs/README.md` is the site home -- MkDocs treats a README.md as the index
# page of its directory, and if both index.md and README.md existed here the README
# would be ignored instead.
site_name: RelicLLM
site_url: https://lvyufeng.github.io/RelicLLM/
site_description: >-
  Multi-GPU inference runtime for older accelerators: model implementations, serving
  adapters and schedulers on PyTorch, over the relic-core operator library
site_author: lvyufeng
copyright: MIT licensed. Model weights and third-party components keep their own licenses.

repo_url: https://github.com/lvyufeng/RelicLLM
repo_name: lvyufeng/RelicLLM
edit_uri: edit/master/docs/

docs_dir: docs
use_directory_urls: true

# The documentation site's two non-page inputs live under `docs/`, which is what makes `docs/**`
# cover them in CI -- but MkDocs copies every file it is not told to skip, so without this block the
# published site would carry the hook's source, its bytecode, and a stray theme override.
#
# Named file by file rather than excluded as two directories. A directory pattern reads better and
# is one line shorter, and it is wrong in a way nothing would catch: MkDocs logs a page dropped by
# `exclude_docs` at INFO, and `--strict` promotes warnings only, so a `.md` that somebody later puts
# in `docs/hooks/` would vanish from the site with a clean exit 0. Leaving the directory publishable
# costs one caveat instead -- a second helper can be added under `docs/hooks/` without being
# excluded, so add it here when there is one.
exclude_docs: |
  /hooks/llms_txt_staleness.py
  /hooks/__pycache__/
  /overrides/main.html

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  # Only main.html lives here, and it does nothing except fill `{% block announce %}`.
  # Material's own main.html is four lines that just extend base.html, so overriding it
  # drops no other block. The path is inside `docs_dir` because that is the documentation
  # site's tree; `exclude_docs` above keeps it out of the published output.
  custom_dir: docs/overrides

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - announce.dismiss
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lvyufeng/RelicLLM
      name: RelicLLM on GitHub

plugins:
  # Chinese search is broken without this block, and it matters here: several of these
  # documents carry Chinese headings, and a query in Chinese against them returns
  # nothing at all rather than ranking badly. Material segments CJK with jieba and
  # joins the pieces with U+200B, which its built-in separator "[\s\-]+" does not
  # match, so every CJK term that was indexed is unreachable by its own words.
  #
  # The separator below is the one Material itself ships in
  # templates/partials/languages/zh.html. It is written with backslash-u escapes
  # rather than the literal characters so that the zero-width space stays visible in
  # review; Python's `re` and the worker's `new RegExp` both accept the escapes.
  #
  # Declaring `plugins:` at all means this list is the whole list. A plugin added
  # later has to be listed here, or it will not run.
  - search:
      lang:
        - en
        - zh
      separator: '[\s\u200b\u3000\-、。，．？！；]+'

